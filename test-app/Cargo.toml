[package]
name = "slint-bridge-test-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "display"
description = "Standalone usage examples and device validation for slint-bridge"

[features]
default = []
fbdev = ["slint-bridge/fbdev"]
nx5 = ["slint-bridge/nx5", "dep:libloading", "dep:libc"]
nx5-tde = ["nx5", "slint-bridge/nx5-tde"]

[dependencies]
slint-bridge = { path = "..", default-features = false }
slint = { version = "=1.18.1", path = "/home/dpower/data/GitHub/slint-1.18.1/api/rs/slint", default-features = false, features = ["std", "renderer-software", "compat-1-18"] }
libloading = { version = "0.8.9", optional = true }
libc = { version = "0.2.190", optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", path = "/home/dpower/data/GitHub/slint-1.18.1/api/rs/build" }

[[bin]]
name = "display"
path = "src/main.rs"

[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "startup-regression"
path = "src/bin/startup-regression.rs"
required-features = ["nx5-tde"]
