[package]
name = "slint-bridge-test-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "display"
description = "Standalone usage examples and device validation for slint-bridge"

[features]
default = []
appos-host = ["slint-bridge/appos-host"]
fbdev = ["slint-bridge/fbdev"]
nx1 = ["slint-bridge/nx1"]
f1 = ["slint-bridge/f1"]
f1-g2d = ["f1", "slint-bridge/f1-g2d"]
nx5 = ["slint-bridge/nx5", "dep:libloading"]
nx5-mma-background = ["nx5-tde", "slint-bridge/nx5-mma-background"]
nx5-test-hooks = ["nx5-mma-background", "slint-bridge/nx5-test-hooks"]
nx5-tde = ["nx5", "slint-bridge/nx5-tde"]
showcase-preview = ["slint/mcp", "dep:i-slint-backend-testing"]

[dependencies]
slint-bridge = { path = "..", default-features = false }
slint = { version = "=1.18.1", git = "https://github.com/omni-stack-gen/slint-swash.git", rev = "c40f989729248185546753d4f5b70b22ed08164e", default-features = false, features = ["std", "renderer-software", "compat-1-18"] }
# Decode the Fluent widgets' embedded SVG icons without a desktop backend.
i-slint-core = { version = "=1.18.1", git = "https://github.com/omni-stack-gen/slint-swash.git", rev = "c40f989729248185546753d4f5b70b22ed08164e", default-features = false, features = ["image-decoders", "svg"] }
libloading = { version = "0.8.9", optional = true }
libc = "0.2.190"
i-slint-backend-testing = { version = "=1.18.1", git = "https://github.com/omni-stack-gen/slint-swash.git", rev = "c40f989729248185546753d4f5b70b22ed08164e", optional = true, features = ["renderer-software"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
slint-build = { version = "=1.18.1", git = "https://github.com/omni-stack-gen/slint-swash.git", rev = "c40f989729248185546753d4f5b70b22ed08164e" }

[[bin]]
name = "display"
path = "src/main.rs"

[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"

[[bin]]
name = "image-decode"
path = "src/bin/image-decode.rs"
required-features = ["f1"]

[[bin]]
name = "startup-regression"
path = "src/bin/startup-regression.rs"
required-features = ["nx5-tde"]

[[bin]]
name = "init-retry"
path = "src/bin/init-retry.rs"
required-features = ["nx5"]

[[bin]]
name = "alpha-regression"
path = "src/bin/alpha-regression.rs"
required-features = ["nx5"]

[[bin]]
name = "background-holes"
path = "src/bin/background-holes.rs"
